<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF5F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calm Days">
<title>Calm Days Mom · Her Midnight Edit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Ruby & gold palette: Blood Red, Rosewood 640D14, Crimson 800E13, Upsdell Red AD2831, Dark Sienna 38040E/250902, Platinum Frosting gold */
:root{--bg:#FBF5F0;--card:#FFFCF8;--text:#2A0A10;--muted:#7A5F5C;--faint:#B09A95;--line:#EFDDD5;--line2:#E2C6BC;--accent:#9E1B25;--gold:#C9A24E;--navy:#640D14;--ok:#5E7A50;--okbg:#E4EBDC;--warn:#AD2831;--warnbg:#F7E1DF;--amb:#8C6E3C;--ambbg:#F6ECD6;--soft:#F7E6E2;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;--shadow:0 10px 24px -16px rgba(56,4,14,.35)}
[data-accent=sage]{--accent:#AD2831;--gold:#D4AF5F;--soft:#FBE4E3;--navy:#800E13}
[data-accent=blush]{--accent:#A8455A;--gold:#D7A0A6;--soft:#F8E6E8;--navy:#7A2335}
[data-accent=lavender]{--accent:#8A6A2E;--gold:#C9A24E;--soft:#F6EEDD;--navy:#38040E}
[data-theme=dark]{--bg:#1A0508;--card:#28090F;--text:#F6EADF;--muted:#C9AAA1;--faint:#80605B;--line:#3D1219;--line2:#541F29;--accent:#DDB866;--gold:#DDB866;--navy:#640D14;--okbg:#22301F;--ok:#9BBE88;--warnbg:#45141B;--warn:#F0989A;--ambbg:#3E3018;--amb:#E5C27F;--soft:#3A111A;--shadow:0 10px 24px -16px rgba(0,0,0,.7)}
[data-theme=dark][data-accent=sage]{--accent:#F07C82;--gold:#F07C82}
[data-theme=dark][data-accent=blush]{--accent:#E8AEB8;--gold:#E8AEB8}
[data-theme=dark][data-accent=lavender]{--accent:#E2C57A;--gold:#E2C57A}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.big{font-size:17px}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
#main{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:21px;font-weight:600}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-style:normal;font-size:17px}
.brand small{display:block;font-family:var(--sans);font-size:9.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:-3px}
.tbtns{display:flex;gap:6px;align-items:center}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);text-align:center;font-size:16px}
.iconbtn.dump{background:var(--soft);color:var(--accent);border-color:transparent;font-weight:600}
.pill{font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:999px;background:var(--navy);color:#F7F1E6}
[data-theme=dark] .pill{background:var(--gold);color:#111}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.08;margin:4px 0}
h1 em,h2 em{font-style:italic;color:var(--accent)}
h2{font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.2}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.card .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.link{font-size:13px;color:var(--accent);font-weight:500}
.hint{color:var(--muted);font-size:13px}
.tiny{font-size:12px;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center}
.wrap{flex-wrap:wrap}
.center{text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.05}
.stat span{font-size:11px;color:var(--muted)}
.stat.red b{color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:99px}
.bar.over i{background:var(--warn)}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t b.wrapb{white-space:normal}
.item .t small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{text-align:right;flex:none;font-size:14px;font-weight:600}
.item .r small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:1.6px solid var(--line2);display:grid;place-items:center;color:#fff;font-size:15px;line-height:1;text-align:center}
.check.on{background:var(--gold);border-color:var(--gold)}
.check.round{border-radius:50%}
.done b{text-decoration:line-through;color:var(--faint)}
.tag{flex:none;white-space:nowrap;display:inline-block;font-size:11px;line-height:1.5;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.tag.ok{background:var(--okbg);border-color:transparent;color:var(--ok)}
.tag.soon{background:var(--ambbg);border-color:transparent;color:var(--amb)}
.tag.gold{background:var(--soft);border-color:transparent;color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{font-size:12.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);white-space:nowrap}
.chip.on{background:var(--navy);color:#F7F1E6;border-color:var(--navy)}
[data-theme=dark] .chip.on{background:var(--gold);color:#111;border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;border:1px solid var(--line2);background:var(--card);text-align:center}
.btn.primary{background:var(--navy);color:#F7F1E6;border-color:var(--navy)}
[data-theme=dark] .btn.primary{background:var(--gold);color:#111;border-color:var(--gold)}
.btn.soft{background:var(--soft);border-color:transparent;color:var(--accent)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.btn.danger{color:var(--warn)}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.in{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line2);background:var(--bg);outline:none}
.in:focus{border-color:var(--gold)}
textarea.in{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .field{margin:6px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:10px 6px;border-radius:12px;border:1px solid var(--line2);font-size:13px;background:var(--bg);text-align:center}
.seg button.on{background:var(--navy);color:#F7F1E6;border-color:var(--navy)}
[data-theme=dark] .seg button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--faint);padding:6px 8px;border-radius:12px;min-width:60px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}
.list-kv div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.list-kv div:last-child{border-bottom:0}
.empty{text-align:center;padding:20px 10px;color:var(--muted)}
.empty b{display:block;font-family:var(--serif);font-size:22px;color:var(--text);font-weight:500;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#F7F1E6;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.demo-bar{background:color-mix(in srgb,var(--gold) 16%,var(--bg));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);text-align:center;font-size:13px;padding:10px 14px;border-radius:14px;margin:0 0 12px}
.demo-bar a{color:var(--accent);font-weight:600}
.grp{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:16px 0 2px}
.grp:first-child{margin-top:2px}
.menu .item{padding:14px 0}
.menu .item .ic{width:40px;height:40px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
.fab{position:fixed;right:max(18px,calc(50% - 300px));bottom:calc(92px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--navy);color:#F7F1E6;font-size:28px;line-height:1;display:grid;place-items:center;text-align:center;box-shadow:0 14px 24px -10px rgba(18,24,48,.6);z-index:15}
[data-theme=dark] .fab{background:var(--gold);color:#111}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
/* today */
.energy{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.energy button{border:1px solid var(--line2);border-radius:14px;padding:12px 6px;text-align:center;background:var(--bg);font-size:13px}
.energy button b{display:block;font-size:20px;line-height:1.2}
.energy button.on{background:var(--navy);color:#F7F1E6;border-color:var(--navy)}
[data-theme=dark] .energy button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.one{background:var(--navy);color:#F3ECDF;border:0;text-align:center;position:relative;overflow:hidden;padding:24px 18px 20px}
.one:before{content:'';position:absolute;inset:10px;border:1px solid rgba(201,164,100,.45);border-radius:14px;pointer-events:none}
.one .eyebrow{color:var(--gold)}
.one .big{font-family:var(--serif);font-size:30px;line-height:1.12;margin:8px 0 6px;color:#F3ECDF}
.one .hint{color:#cfc6b4}
.one .btn{position:relative;z-index:1}
.one .btn.primary{background:var(--gold);color:#38040E;border-color:var(--gold)}
.one .btn.ghost{background:transparent;color:#F3ECDF;border-color:rgba(243,236,223,.35)}
.one .steps{text-align:left;max-width:380px;margin:12px auto 0;position:relative;z-index:1}
.one .steps .item{border-color:rgba(243,236,223,.15);padding:8px 0}
.one .steps .item .t b{color:#F3ECDF;font-weight:500;white-space:normal}
.one .steps .done .t b{color:#8f8a7c}
.one .check{border-color:rgba(243,236,223,.45)}
.timeleft{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
.water{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.water button{width:34px;height:40px;border-radius:8px 8px 12px 12px;border:1.5px solid var(--line2);background:var(--bg);font-size:15px}
.water button.on{background:color-mix(in srgb,#6f9cc4 55%,var(--bg));border-color:#6f9cc4}
.jar{display:flex;gap:14px;align-items:center}
.jar .j{flex:none;width:54px;height:66px;border:2px solid var(--line2);border-top-width:6px;border-radius:10px 10px 16px 16px;position:relative;overflow:hidden;background:var(--bg)}
.jar .j i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--gold),var(--accent))}
.week7{display:flex;gap:5px}
.week7 button{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line2);font-size:11px;color:var(--muted);display:grid;place-items:center;background:var(--bg)}
.week7 button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.week7 button.rest{border-style:dashed}
.week7 button.today{outline:1.5px solid var(--accent);outline-offset:1px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .dn{font-size:10.5px;text-align:center;color:var(--faint);padding:2px 0}
.cal button{aspect-ratio:1;border-radius:10px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid transparent}
.cal button.out{color:var(--faint)}
.cal button.today{border-color:var(--accent);font-weight:700}
.cal button.sel{background:var(--navy);color:#F7F1E6}
[data-theme=dark] .cal button.sel{background:var(--gold);color:#111}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.cal .dots i.e{background:#6f9cc4}.cal .dots i.b{background:var(--warn)}
.ev{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.ev:last-child{border-bottom:0}
.ev .time{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--accent)}
/* timer */
.ring{position:relative;width:240px;height:240px;margin:10px auto}
.ring svg{width:240px;height:240px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--serif);font-size:54px;line-height:1}
.ring .v small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.06em}
.buddy{text-align:center;font-family:var(--serif);font-style:italic;font-size:20px;color:var(--accent);min-height:30px}
.breathe{width:14px;height:14px;border-radius:50%;background:var(--gold);margin:8px auto;animation:br 6s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.5);opacity:1}}
/* goal ring */
.gring{flex:none;width:52px;height:52px;position:relative}
.gring svg{width:52px;height:52px;transform:rotate(-90deg)}
.gring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;font-weight:600}
/* meals */
.mealgrid{display:grid;grid-template-columns:52px repeat(3,1fr);gap:6px;font-size:12.5px}
.mealgrid .h{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center;padding:2px 0}
.mealgrid .d{font-weight:600;font-size:12px;align-self:center}
.mealgrid button{min-height:44px;border:1px dashed var(--line2);border-radius:10px;padding:5px;font-size:12px;line-height:1.25;color:var(--muted);background:var(--bg);text-align:center}
.mealgrid button.f{border-style:solid;color:var(--text);background:var(--card)}
.mealgrid .today{color:var(--accent)}
/* mood */
.moods{display:flex;justify-content:space-between;gap:6px;margin-top:10px}
.moods button{flex:1;font-size:26px;padding:8px 0;border-radius:14px;border:1px solid var(--line2);background:var(--bg)}
.moods button.on{background:var(--soft);border-color:var(--gold)}
.mtrack{display:flex;gap:4px;align-items:flex-end;height:60px;margin-top:10px}
.mtrack div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.mtrack i{width:100%;border-radius:5px 5px 2px 2px;background:var(--gold);min-height:3px;opacity:.85}
.mtrack small{font-size:9px;color:var(--faint)}
/* sheet */
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.open{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(10,12,24,.45)}
#sheet .box{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;box-shadow:0 -20px 40px -20px rgba(0,0,0,.4)}
#sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
.dumpin{min-height:120px}
.steped .row{margin:6px 0}
.steped .row .in{padding:9px 12px}
.xbtn{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);color:var(--muted);text-align:center}
.setup .opt{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.setup .opt:last-child{border-bottom:0}
.setup .opt input{width:20px;height:20px;flex:none}
.cele{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.cele i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.prow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.prow button{border:1px solid var(--line2);border-radius:14px;padding:8px 2px;text-align:center;background:var(--bg);font-size:12px;line-height:1.25}
.prow button b{display:block;font-weight:600;font-size:12.5px}
.prow button small{display:block;color:var(--muted);font-size:10.5px}
.prow button span{display:block;font-size:12px;color:var(--faint);min-height:15px}
.prow button.next{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.prow button.on{background:var(--navy);color:#F7EFE6;border-color:var(--navy)}
.prow button.on small,.prow button.on span{color:var(--gold)}
.juz{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.juz button{text-align:center;aspect-ratio:1.4;border-radius:10px;border:1px solid var(--line2);background:var(--bg);font-size:13px;font-weight:600;color:var(--muted)}
.juz button.on{background:var(--navy);border-color:var(--navy);color:var(--gold)}
.who{display:inline-flex;align-items:center;gap:4px;margin-right:6px;font-weight:600;color:var(--text)}
.who i,.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,var(--gold));margin-right:4px;vertical-align:0}
.av{flex:none;width:34px;height:34px;border-radius:50%}
.week7 button.tiny{background:color-mix(in srgb,var(--gold) 45%,var(--bg));border-color:var(--gold);color:var(--text)}
#print{display:none}
@media print{
  body{background:#fff;padding:0;color:#111}
  body>*:not(#print){display:none!important}
  #print{display:block;font-family:Inter,system-ui,sans-serif;font-size:11pt;color:#111}
  #print h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:30pt;font-weight:500;margin:0 0 4pt}
  #print h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:17pt;font-weight:600;margin:14pt 0 4pt}
  #print .pb{font-size:9pt;letter-spacing:.2em;text-transform:uppercase;color:#8a6f3a;margin-bottom:6pt}
  #print table{width:100%;border-collapse:collapse;margin-top:8pt}
  #print th,#print td{text-align:left;padding:5pt 6pt;border-bottom:1px solid #ddd;vertical-align:top}
  #print th{font-size:8.5pt;letter-spacing:.08em;text-transform:uppercase;color:#666}
  #print .cols{columns:2;column-gap:24pt}

    (L[1][L[2]]||[]).forEach(function(x){ var i=byId[x.id]; if(i===undefined&&key&&x[key]&&!x.log) i=byKey[String(x[key]).toLowerCase()]; if(i===undefined){ if(!gone[x.id]){ mine.push(x); added++; } return; }

  for(var d1 in o.rdone){ S.rdone[d1]=S.rdone[d1]||{}; for(var r in o.rdone[d1]) if(o.rdone[d1][r]) S.rdone[d1][r]=true; }
